# SWEEP ARM B: 64-byte data cache lines (Arduino/control ships 32).
#
# Hypothesis: the measured 60.7 MB/s PSRAM ceiling is a cache-fill GRANULARITY
# limit, not a bus limit. The output head streams 1.26 MB per token with zero
# reuse, so every access is a compulsory miss; doubling the line halves the
# number of miss transactions and doubles the burst length per transaction.
#
# Falsifiable: if 60.7 MB/s is the bus, this changes nothing. Cycle 09b already
# showed three independent access mechanisms (cached scalar loads, cached vector
# loads, CPU memcpy) all land within 2% of each other -- but all three went
# through the same 32-byte fill path, so none of them separates these two
# explanations. This arm does.
CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y

# RESULT (cycles 17, 20, 21): CONFIRMED and adopted. 30.33 -> 38.71 tok/s, and
# 40.01 once llm_forward's 21 KB stack frame was removed. The profile now
# measures the head directly at 14.6 ms/token for 1.26 MiB, i.e. 86.3 MiB/s,
# against 20.8 ms and 60.6 MiB/s on 32-byte lines. The bus was never the limit;
# the fill granularity was. cache64.conf is the control that proves it.
