# SWEEP ARM D: 120 MHz octal PSRAM (control runs 80).
#
# The single largest untried lever in this project, flagged as such in the
# ledger since Cycle 08 and unreachable from Arduino because the FQBN does not
# expose it. The ESP32-S3 datasheet states "configurable clock frequency with a
# maximum of 120 MHz for 8-line SPI SDR/DDR modes", and this board carries an
# ESP32-S3R8 (v0.2 silicon) with 8 MB octal PSRAM in package.
#
# Why it matters more than anything else available: the output head is 20.8 ms
# of a 32.1 ms token and reads 1.26 MB at 60.6 MB/s against a measured 60.7 MB/s
# ceiling -- 99.8%. No kernel, instruction, DMA or core-count change reaches it
# (Cycle 09b closed all of those). Only raising the wall does. 80 -> 120 MHz is
# 1.5x on the wall if it holds.
#
# RISK, stated before running: 120 MHz octal PSRAM carries chip-revision caveats
# and Espressif documents it as experimental on some revisions. Failure modes
# are (a) refuses to init and the board does not boot, (b) boots but corrupts
# PSRAM data, which would show up as changed output text rather than a crash.
#
# The bit-identity check is therefore load-bearing on this arm specifically:
# a silent PSRAM corruption at 120 MHz would look like a speedup. Any text
# divergence here is a FAILED arm, not a quality trade to be measured -- there
# is no plausible mechanism by which a pure clock change alters greedy output.
CONFIG_SPIRAM_SPEED_80M=n
CONFIG_SPIRAM_SPEED_120M=y
