# Route printf/scanf to the ROM-resident newlib-nano formatter.
#
# The Arduino build formats via HardwareSerial::printf -> vsnprintf into a stack
# buffer and never crashes. The IDF shim routes to full newlib printf, which for
# a line with five doubles reaches _dtoa_r -> _Balloc -> malloc and faults
# inside the allocator -- with comprehensive heap poisoning reporting the heap
# INTACT, so it is not corruption from our writes.
#
# Nano format uses the printf already in ROM. Per components/newlib/Kconfig
# those functions "can also run when flash instruction cache is disabled",
# which the flash-resident full formatter cannot. That difference is the last
# untested distinction between the two paths.
#
# Cost: no 64-bit integer formats and no C99 positional args. The sketch prints
# only %d/%u/%f/%s and casts its int64 microsecond counters to double before
# printing, so nothing here needs them.
CONFIG_NEWLIB_NANO_FORMAT=y
