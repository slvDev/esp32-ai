# SWEEP ARM C: 64 KB data cache (Arduino/control ships 32 KB of the S3's 64).
#
# Prediction recorded BEFORE measuring: this does nothing for the head. The head
# streams 1.26 MB per token in one sequential pass with no reuse whatsoever, so
# there is no working set for a larger cache to retain -- 32 KB and 64 KB both
# miss on every line.
#
# Run anyway, for two reasons. It is the control for the line-size arm: if
# line64 wins and cache64 does not, the gain is burst length rather than
# capacity, which is a mechanism claim rather than a number. And the core is
# 71% resident in internal SRAM but 89 KB still lives in PSRAM and IS re-read
# across layers, so a larger cache could help ffn/ple even while doing nothing
# for the head. The per-stage profile will separate those.
#
# Costs internal SRAM: cache is carved out of the same 512 KB the staged core
# competes for, so watch the boot line's "core SRAM / PSRAM" split. If staging
# spills to PSRAM this arm can lose outright.
CONFIG_ESP32S3_DATA_CACHE_32KB=n
CONFIG_ESP32S3_DATA_CACHE_64KB=y

# RESULT (cycle 18, three captures): REJECTED. 38.40 tok/s vs 38.71 for line64
# alone -- 0.8% slower. The prediction above held exactly: capacity does nothing
# for a no-reuse stream, and the second 32 KB came out of the staging budget
# (core SRAM 234056 -> 202056 B, 76% -> 65% in the fast tier), which is what the
# loss is. Kept in the tree as the control that turns cycle 17 from a number
# into a mechanism: the win is burst length, not capacity.
