# DIAGNOSTIC overlay: catch the heap corruption behind the _dtoa_r crash.
#
# Symptom: printf of the accounting line faults inside
# heap_caps_aligned_alloc_base with EXCVADDR 0x1912 and A2/A3 = 0 -- the
# allocator dereferencing a value that is not a pointer. That is corrupted heap
# metadata, so the damage happened earlier and elsewhere; the printf is only the
# first allocation unlucky enough to touch it.
#
# A worker-stack-overflow hypothesis (4096 -> 8192) was tested and did NOT fix
# it, so guessing is over. Comprehensive poisoning writes head/tail canaries on
# every block and verifies them on every heap operation, so the abort fires at
# the overrunning free/alloc rather than 200 tokens later, and names the block.
#
# This costs throughput and must never be used for a benchmark number -- it is a
# diagnostic build only.
CONFIG_HEAP_POISONING_COMPREHENSIVE=y
CONFIG_HEAP_TRACING_STANDALONE=y
CONFIG_HEAP_USE_HOOKS=y
